        animation: none;

<body>
  <div id="app">
    <main class="startup-screen">
      <section class="startup-card">
        <div class="startup-logo">SP</div>
        <h1>StationeryPro</h1>
        <p id="startup-message" role="status">
          Tunaandaa mfumo wako. Tafadhali subiri...
        </p>
        <div class="startup-spinner" aria-hidden="true"></div>
        <pre id="startup-details" class="startup-details"></pre>
      </section>
    </main>
  </div>

  <script>
    window.__stationeryProStarted = false;

    window.__stationeryProShowError = function (message) {
      const status = document.getElementById("startup-message");
      const spinner = document.querySelector(".startup-spinner");
      const details = document.getElementById("startup-details");

      if (status) {
        status.textContent =
          "StationeryPro haijaweza kuanza. Taarifa ya hitilafu iko hapa chini.";
        status.className = "startup-error";
      }

      if (spinner) {
        spinner.style.display = "none";
      }

      if (details) {
        details.style.display = "block";
        details.textContent = String(message || "Hitilafu haijulikani.");
      }
    };

    window.setTimeout(function () {
      if (window.__stationeryProStarted) return;

      window.__stationeryProShowError(
        "Mfumo haujathibitisha kuanza ndani ya sekunde 15. " +
        "Angalia JavaScript Console na Network kwa faili zilizoshindwa kupakiwa."
      );
    }, 15000);

    window.addEventListener("error", function (event) {
      if (event.message) {
        console.error("[StationeryPro] JavaScript error:", event.message);
      }
    });

    window.addEventListener("unhandledrejection", function (event) {
      console.error("[StationeryPro] Promise error:", event.reason);
    });
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
